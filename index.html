<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="center-container">
        <h1>Will You Be My Valentine? ❤️</h1>
        <p>Click the buttons below to answer:</p>


        <button id="yes-btn">Yes 😊</button>
        <button id="no-btn">No 😢</button>
    </div>


   
    <div id="yay-page" style="display: none; text-align: center; padding: 50px;">
        <h1>Yay! ❤️</h1>
        <p>HIHI! I'm so happy! See you, wubby!! 🥰</p>
        <img src="https://media1.tenor.com/m/e7S1Y510BSEAAAAd/bubu-dudu-valentine%27s-day-happy-valentine%27s-day-bubu.gif" alt="Happy Valentine message" width="300">
        <p><strong>This bouquet is for you! 💐</strong></p>
        <button id="next-btn">Next</button>
    </div>


  
    <div id="love-letter" style="display: none;">
        <h2>💌 A Special Message Just for You 💌</h2>
        <div id="love-letter-content">
            <p id="letter-content">Click the button below to reveal your special message!</p>
        </div>
        <button id="reveal-btn">Open Love Letter 💖</button>
    </div>


    <script src="script.js"></script>
</body>
</html>
